services:
  polargraphd:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      POLARGRAPH_DATA_DIR: /data
      POLARGRAPH_LISTEN_ADDR: "0.0.0.0:50051"
      POLARGRAPH_METRICS_PORT: "9090"
      RUST_LOG: info
    ports:
      - "50051"
      - "9090"
    healthcheck:
      # Use bash /dev/tcp to check if the metrics HTTP port is accepting connections.
      # debian:bookworm-slim includes bash; no external tool (curl/wget) required here.
      test: ["CMD-SHELL", "bash -c 'echo healthy > /dev/tcp/localhost/9090' >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 20

  rest-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.rest
    environment:
      POLARGRAPH_UPSTREAM: "http://polargraphd:50051"
      POLARGRAPH_REST_LISTEN: "0.0.0.0:8000"
    ports:
      - "8000"
    depends_on:
      polargraphd:
        condition: service_healthy
