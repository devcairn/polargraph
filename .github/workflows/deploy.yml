# Build and push Docker images to ghcr.io after CI passes.
# Images are public on ghcr.io; no registry credentials needed on the server.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  build-and-push:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run doesn't carry the triggering SHA automatically
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── polargraph-db (Dockerfile) ─────────────────────────────────────────
      - name: Build and push polargraph-db
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/devcairn/polargraph-db:latest
            ghcr.io/devcairn/polargraph-db:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=polargraph-db
          cache-to: type=gha,mode=max,scope=polargraph-db

      # ── polargraph-rest (Dockerfile.rest) ──────────────────────────────────
      - name: Build and push polargraph-rest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rest
          push: true
          tags: |
            ghcr.io/devcairn/polargraph-rest:latest
            ghcr.io/devcairn/polargraph-rest:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=polargraph-rest
          cache-to: type=gha,mode=max,scope=polargraph-rest

