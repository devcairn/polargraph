name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y librocksdb-dev clang libclang-dev protobuf-compiler

      - name: Run tests
        run: cargo test --workspace --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y librocksdb-dev clang libclang-dev protobuf-compiler

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # Builds a release binary and uploads it as an artifact.
  # Runs on main-branch pushes and version tags only.
  release:
    name: Release build
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y librocksdb-dev clang libclang-dev protobuf-compiler

      - name: Build release
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: polargraphd-linux-amd64
          path: target/release/polargraphd
          if-no-files-found: error

  # Builds and pushes Docker images to ghcr.io on every push to main.
  # polargraph-db  — core storage daemon  (Dockerfile)
  # polargraph-rest — HTTP gateway        (Dockerfile.rest)
  docker:
    name: Docker publish
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push polargraph-db
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/devcairn/polargraph-db:latest
          cache-from: type=gha,scope=polargraph-db
          cache-to: type=gha,mode=max,scope=polargraph-db

      - name: Build and push polargraph-rest
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.rest
          push: true
          tags: ghcr.io/devcairn/polargraph-rest:latest
          cache-from: type=gha,scope=polargraph-rest
          cache-to: type=gha,mode=max,scope=polargraph-rest

  # Spins up polargraphd + REST gateway in Docker and runs the Python E2E suite.
  e2e:
    name: E2E Docker tests
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Run E2E tests
        run: bash tests/e2e/run.sh
