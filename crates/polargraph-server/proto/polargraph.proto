syntax = "proto3";
package polargraph.v1;

// ── Primitive types ───────────────────────────────────────────────────────────

/// 16-byte UUID v7 (time-ordered). Always exactly 16 bytes.
message NodeId {
    bytes bytes = 1;
}

/// Scalar property value. Exactly one field must be set.
message Value {
    oneof kind {
        bool       null_val   = 1;
        bool       bool_val   = 2;
        sint64     int_val    = 3;
        double     float_val  = 4;
        string     text_val   = 5;
        bytes      blob_val   = 6;
        FloatArray vec_val    = 7;
        LangText   lang_text  = 8;
        TypedLiteral typed    = 9;
    }
}

/// A language-tagged string (rdf:langString), e.g. "Acme"@en.
message LangText {
    string text = 1;
    string lang = 2;
}

/// An RDF literal with a datatype that has no native Value kind,
/// e.g. "2026-09-29"^^<http://www.w3.org/2001/XMLSchema#date>.
message TypedLiteral {
    string lexical  = 1;
    /// Full datatype IRI.
    string datatype = 2;
}

/// A dense float32 embedding vector.
message FloatArray {
    repeated float values = 1;
}

// ── Triples ───────────────────────────────────────────────────────────────────

/// A named scalar property on an edge (subject is the edge's UUID).
message EdgeProperty {
    string name  = 1;
    Value  value = 2;
}

/// A directed edge between two nodes.
message RelationTriple {
    NodeId subject   = 1;
    string predicate = 2;
    NodeId object    = 3;
    /// Valid-time start, microseconds since Unix epoch.
    int64  vt_start  = 4;
    /// Valid-time end. Set to int64 max (9223372036854775807) for open-ended facts.
    int64  vt_end    = 5;
    /// Optional scalar properties carried by this edge.
    /// Each property is stored as a Property triple whose subject is the edge UUID.
    repeated EdgeProperty properties = 6;
    /// The object named by IRI instead of `object`: a full IRI, `prefix:local`
    /// or a bare name (resolved through the vocabulary). The server maps it to
    /// its node and records the IRI — e.g. `rdf:type` to a class by name.
    string object_iri = 7;
}

/// A scalar property on a node.
/// How a property write treats existing values of the same
/// (subject, predicate, graph). See docs/design/v3-key-layout.md §6.
enum PropertyWriteMode {
    /// REPLACE for an open-ended value (vt_end unset / end of time), ADD for
    /// a closing write. The default — matches pre-v3 behaviour.
    PROPERTY_WRITE_MODE_AUTO = 0;
    /// Close every other open value of (s, p, g), then write this one.
    PROPERTY_WRITE_MODE_REPLACE = 1;
    /// Write alongside existing values (multi-valued properties, RDF).
    PROPERTY_WRITE_MODE_ADD = 2;
}

message PropertyTriple {
    NodeId subject   = 1;
    string predicate = 2;
    Value  value     = 3;
    int64  vt_start  = 4;
    int64  vt_end    = 5;
    PropertyWriteMode mode = 6;
}

message Triple {
    oneof kind {
        RelationTriple relation = 1;
        PropertyTriple property = 2;
    }
}

// ── Query types ───────────────────────────────────────────────────────────────

/// A slot in a query pattern.
///
/// - `bound`: matches exactly this node ID.
/// - `var`:   a named variable — binds on first match, constrains on subsequent.
/// - neither: wildcard, matches any node (equivalent to `_` in Prolog).
message Term {
    oneof kind {
        NodeId bound = 1;
        string var   = 2;
        /// Object slot only: matches property triples whose value equals this.
        Value literal = 3;
    }
}

/// A triple pattern with variable slots.
///
/// `predicate` is optional; empty string or omitted means "any predicate".
message VarPattern {
    Term   subject   = 1;
    string predicate = 2;
    Term   object    = 3;
    /// Optional variable name that receives the matched predicate string for
    /// each binding (see `Binding.predicates`). Empty string or omitted means
    /// the matched predicate is not captured.
    string predicate_var = 4;
    /// Which graph(s) the pattern matches in. Unset = every graph (union),
    /// or the request's `graphs` dataset when one is given.
    GraphTerm graph = 5;
}

/// The graph slot of a pattern.
message GraphTerm {
    oneof kind {
        /// true = only the default graph.
        bool     default_graph = 1;
        /// One named graph, by IRI. An unknown IRI matches nothing.
        string   iri           = 2;
        /// A graph variable: binds the IRI node of each match's named graph
        /// (never the default graph); restricts the match when already bound.
        string   var           = 3;
        /// A set of named graphs, by IRI.
        GraphSet set           = 4;
    }
}

message GraphSet {
    repeated string iris = 1;
}

/// A Datalog rule used in recursive queries.
///
/// Semantics: `head_predicate(head_subject_var, head_object_var) :- body`.
/// The rule fires whenever all body patterns are satisfied, deriving a new
/// (head_subject_var, head_object_var) pair under `head_predicate`.
message DatalogRule {
    /// Name of the derived (IDB) predicate this rule produces.
    string              head_predicate    = 1;
    /// Variable name in `body` that maps to the derived edge's subject.
    string              head_subject_var  = 2;
    /// Variable name in `body` that maps to the derived edge's object.
    string              head_object_var   = 3;
    /// Conjunctive body — all patterns must be satisfied simultaneously.
    repeated VarPattern body              = 4;
}

// ── Requests and responses ────────────────────────────────────────────────────

// ── RDF-star edge annotations ─────────────────────────────────────────────────

/// An annotation on a relation triple (RDF-star / RDF*).
///
/// `edge_id` is the 16-byte UUID of the relation triple to annotate — obtained
/// from `InsertResponse.edge_ids`. `value` is either a scalar (`scalar`) or a
/// reference to another node (`node_id`).
message EdgeAnnotation {
    bytes  edge_id   = 1;
    string predicate = 2;
    oneof value {
        bytes node_id = 3;
        Value scalar  = 4;
    }
}

message GetEdgeAnnotationsRequest {
    bytes edge_id = 1;
}

message GetEdgeAnnotationsResponse {
    repeated EdgeAnnotation annotations = 1;
}

/// Resolve the edge UUID(s) for a specific (subject, predicate, object) relation triple.
/// Returns one edge_id per MVCC version currently visible in the store. For most
/// applications a single version is expected; SPARQL-star annotation lookup uses
/// the most-recent entry.
message GetEdgeIdsByTripleRequest {
    bytes  subject_id = 1;
    string predicate  = 2;
    bytes  object_id  = 3;
}

message GetEdgeIdsByTripleResponse {
    /// Each entry is a 16-byte UUID (big-endian) identifying one edge instance.
    repeated bytes edge_ids = 1;
}

message InsertRequest {
    repeated Triple triples = 1;
    /// Optional open-transaction ID. When set, triples are buffered into the
    /// named transaction rather than auto-committed.
    string tx_id = 2;
    /// Optional RDF-star annotations to attach to relation triples in the same
    /// atomic commit. Each annotation references an edge by its UUID bytes
    /// (either from a previous insert or from a relation in `triples` above
    /// where the edge UUID must be known in advance).
    repeated EdgeAnnotation edge_annotations = 3;
    /// IRIs of nodes written in this request, recorded in the IRI dictionary in
    /// the same commit so export can render them. Each IRI names the node
    /// `iri_to_node_id(iri)` (urn:uuid:<u> → u, otherwise xxHash3-128); urn:uuid
    /// IRIs are accepted and ignored. A request may carry only IRIs.
    repeated string iris = 4;
    /// Named graph (IRI) every triple and annotation in this request goes to;
    /// interned on first use. Empty = the default graph.
    string graph = 5;
    /// Caller identity (optional; also `x-polargraph-user-id`). When set, the
    /// graph ACL applies — see docs/design/graph-acl.md.
    string user_id = 6;
}

message InsertResponse {
    /// Transaction time of the committed write, microseconds since epoch.
    int64 commit_ts = 1;
    /// UUID bytes for each RelationTriple in the request (same order).
    /// Use these to store or query edge properties by edge ID.
    repeated bytes edge_ids = 2;
}

message QueryRequest {
    repeated VarPattern patterns    = 1;
    /// Read snapshot timestamp (microseconds since epoch).
    /// 0 or omitted means "latest committed state".
    int64               snapshot_ts      = 2;
    /// Valid-time point-in-time filter (unix microseconds).
    /// Only triples whose valid-time window [vt_start, vt_end) contains this
    /// value are returned. 0 = now (current state; deleted/closed triples are
    /// hidden). Set to a past timestamp for historical/time-travel queries.
    int64               as_of_valid_time = 3;
    /// Transaction-time point-in-time filter (unix microseconds).
    /// When non-zero, overrides snapshot_ts — only triples committed at or
    /// before this wall-clock time are visible. 0 = use snapshot_ts (or latest).
    int64               as_of_tx_time    = 4;
    /// Optional Datalog rules. When non-empty the server runs the rules to a
    /// fixed point (deriving IDB facts) then evaluates `patterns` against the
    /// combined base + derived fact set.
    repeated DatalogRule rules           = 5;
    /// Optional open-transaction ID. When set, the query reads from the
    /// transaction's snapshot (including its uncommitted write buffer).
    string tx_id = 6;
    /// Optional identity for access-control filtering. When set and the server
    /// has an access cache entry for this user, results are filtered to nodes
    /// the user is allowed to see. Empty string = no filtering.
    string user_id = 7;
    /// Named query parameters for use with `$param` syntax. Keys are parameter names
    /// (without the `$`); values are JSON-encoded `Value` objects.
    map<string, string> params = 8;
    /// Dataset: graph IRIs that patterns without their own `graph` term match
    /// in (like SPARQL FROM). Empty = every graph.
    repeated string graphs = 9;
    /// Leave out inferred facts (the `urn:pg:inferred:*` graphs written by
    /// OWL RL inference); by default they are included.
    bool exclude_inferred = 10;
}

/// One satisfying assignment of all variables in the query.
message Binding {
    map<string, NodeId> vars = 1;
    /// Predicate strings bound via `VarPattern.predicate_var`, keyed by
    /// variable name.
    map<string, string> predicates = 2;
    /// Variables bound to property values (literals), keyed by variable name
    /// — e.g. `?n` in `?p name ?n`. A variable is in `vars` or `values`,
    /// never both. Vectors don't bind. See docs/design/value-bindings.md.
    map<string, Value> values = 3;
}

message QueryResponse {
    repeated Binding bindings = 1;
}

/// One row in a streaming query response. Structurally identical to `Binding`;
/// provided as a distinct message so streaming and non-streaming RPCs can evolve
/// independently.
message QueryResult {
    map<string, NodeId> vars = 1;
    /// Variables bound to property values — as `Binding.values`.
    map<string, Value> values = 2;
}

/// A chunk of results delivered by a streaming query RPC.
/// The final chunk always has `done = true`; earlier chunks have `done = false`.
message QueryStreamChunk {
    repeated QueryResult results    = 1;
    uint64               chunk_index = 2;
    bool                 done        = 3;
}

// ── Reachability ─────────────────────────────────────────────────────────────

message ReachableRequest {
    NodeId start     = 1;
    string predicate = 2;
    /// Maximum number of hops to follow. 0 = unlimited depth.
    uint32 max_hops  = 3;
}

message ReachableResponse {
    repeated NodeId node_ids = 1;
}

// ── Vector search ─────────────────────────────────────────────────────────────

message InsertVectorRequest {
    NodeId         node_id = 1;
    repeated float vector  = 2;
    /// Named HNSW space. Defaults to "default" if empty.
    string         space   = 3;
}

message InsertVectorResponse {}

message SearchVectorRequest {
    repeated float query = 1;
    /// Number of nearest neighbors to return.
    uint32         k     = 2;
    /// Named HNSW space. Defaults to "default" if empty.
    string         space = 3;
    /// HNSW exploration factor. Higher = better recall, slower.
    /// 0 means use the server-wide default (--default-vector-ef, default 50).
    uint32         ef    = 4;
}

message VectorSearchResult {
    NodeId node_id    = 1;
    /// Cosine similarity score ∈ [-1, 1]; higher = more similar.
    float  similarity = 2;
}

message SearchVectorResponse {
    repeated VectorSearchResult results = 1;
}

// ── Filtered vector search ────────────────────────────────────────────────────

/// Restrict results to nodes whose `__type` property matches `type_name`.
message NodeTypeFilter {
    string type_name = 1;
}

/// Restrict results to nodes reachable from `from_node` via `predicate`.
/// max_hops = 0 means unlimited depth.
message ReachabilityFilter {
    NodeId from_node  = 1;
    string predicate  = 2;
    uint32 max_hops   = 3;
}

message SearchVectorFilteredRequest {
    string         space = 1;
    repeated float query = 2;
    uint32         k     = 3;
    oneof filter {
        NodeTypeFilter    node_type_filter    = 4;
        ReachabilityFilter reachability_filter = 5;
    }
    /// HNSW exploration factor. 0 = use server default.
    uint32         ef    = 6;
    /// Optional identity for access-control filtering.
    string         user_id = 7;
}

message SearchVectorFilteredResponse {
    repeated VectorSearchResult results = 1;
}

// ── Vector search in set ──────────────────────────────────────────────────────

message SearchVectorInSetRequest {
    string         space    = 1;
    repeated float query    = 2;
    uint32         k        = 3;
    repeated NodeId node_ids = 4;
}

message SearchVectorInSetResponse {
    repeated VectorSearchResult results = 1;
}

// ── Batch insert vectors ──────────────────────────────────────────────────────

message VectorItem {
    NodeId         node_id = 1;
    repeated float vector  = 2;
}

message BatchInsertError {
    uint32 index   = 1;
    string message = 2;
}

message BatchInsertVectorsRequest {
    string               space = 1;
    repeated VectorItem  items = 2;
}

message BatchInsertVectorsResponse {
    uint32                    count_inserted = 1;
    repeated BatchInsertError errors         = 2;
}

// ── Node type registry ────────────────────────────────────────────────────────

/// Declares the expected kind for a single named field.
message FieldDef {
    string field_name = 1;
    /// One of: "bool", "int", "float", "text", "blob", "vector"
    string kind       = 2;
    bool   required   = 3;
}

/// Metadata for a node type's vector embedding space.
message VectorSpaceDef {
    string space_name      = 1;
    uint32 dimensions      = 2;
    /// Optional embedding model name (informational).
    string embedding_model = 3;
    /// Vector storage mode. One of: "memory" (default) or "mmap".
    /// "mmap" keeps vectors on disk and pages them in via mmap; lower RAM,
    /// higher cold-query latency. Changing the mode after first insert has
    /// no effect — the space retains the mode it was created with.
    string storage_mode    = 4;
    /// "" (full precision) or "int8": int8 codes in RAM, full vectors on disk
    /// (mmap), search re-ranked with the exact vectors; ~4× less vector RAM.
    /// Setting it on an existing space quantizes it on its next insert.
    string quantization    = 5;
}

/// A named node type schema.
message NodeTypeDef {
    string            type_name    = 1;
    repeated FieldDef fields       = 2;
    /// Optional vector space definition. Absent if the type has no vector space.
    VectorSpaceDef    vector_space = 3;
    /// Parent type names. This type inherits all fields declared by each parent.
    repeated string   parent_types = 4;
}

message RegisterNodeTypeRequest {
    NodeTypeDef definition = 1;
}

message RegisterNodeTypeResponse {}

message GetNodeTypeRequest {
    string type_name = 1;
}

message GetNodeTypeResponse {
    /// Absent if the type has not been registered.
    NodeTypeDef definition = 1;
}

message ListNodeTypesRequest {}

message ListNodeTypesResponse {
    repeated NodeTypeDef definitions = 1;
}

message ValidateNodeRequest {
    string             type_name  = 1;
    /// A property map: predicate name → value.
    map<string, Value> properties = 2;
}

message ValidateNodeResponse {
    bool            valid  = 1;
    repeated string errors = 2;
}

// ── Edge type registry ────────────────────────────────────────────────────────

/// A named edge type schema.
message EdgeTypeDef {
    /// The predicate string this schema governs (e.g. "works_at").
    string            predicate   = 1;
    /// Expected node type for the subject. Empty string means unconstrained.
    string            domain      = 2;
    /// Expected node type for the object. Empty string means unconstrained.
    string            range       = 3;
    repeated FieldDef fields      = 4;
    /// Cardinality constraint. One of: "many" (default), "one_to_many",
    /// "many_to_one", "one_to_one". Empty string is treated as "many".
    string            cardinality = 5;
    /// Inverse predicate name. If set, every (A, predicate, B) triple must
    /// have a corresponding (B, inverse_of, A) triple. Advisory — not
    /// enforced in storage, checked on insert and via ValidateOntology.
    string            inverse_of  = 6;
}

message RegisterEdgeTypeRequest {
    EdgeTypeDef definition = 1;
}

message RegisterEdgeTypeResponse {}

message GetEdgeTypeRequest {
    string predicate = 1;
}

message GetEdgeTypeResponse {
    /// Absent if the predicate has not been registered.
    EdgeTypeDef definition = 1;
}

message ListEdgeTypesRequest {}

message ListEdgeTypesResponse {
    repeated EdgeTypeDef definitions = 1;
}

message ValidateEdgeRequest {
    string             predicate   = 1;
    /// Node type of the subject. Empty means unknown.
    string             subject_type = 2;
    /// Node type of the object. Empty means unknown.
    string             object_type  = 3;
    /// Edge property map: predicate name → value.
    map<string, Value> properties   = 4;
}

message ValidateEdgeResponse {
    bool            valid  = 1;
    repeated string errors = 2;
}

message ValidateOntologyRequest {}

message OntologyViolation {
    /// One of: "cardinality", "inverse", "cycle".
    string violation_type = 1;
    /// Predicate or type name involved in the violation.
    string name           = 2;
    string message        = 3;
}

message ValidateOntologyResponse {
    bool                       valid      = 1;
    repeated OntologyViolation violations = 2;
}

message ListPredicatesBetweenRequest {
    string domain_type = 1;
    string range_type  = 2;
}

message ListPredicatesBetweenResponse {
    repeated string predicates = 1;
}

// ── VectorSeedQuery ───────────────────────────────────────────────────────────

/// One result row from a VectorSeedQuery: a complete variable binding set with
/// the similarity score of the ANN seed node attached.
message ScoredBinding {
    /// Variable bindings — same schema as `Binding.vars`.
    map<string, NodeId> vars  = 1;
    /// Cosine similarity score of the seed node that produced this row.
    float               score = 2;
}

/// Combine ANN vector search with a conjunctive Datalog graph query in a single
/// server-side call. The k nearest neighbors become initial bindings for
/// `seed_variable`; the graph patterns then filter and join those seeds.
message VectorSeedQueryRequest {
    /// Named HNSW space to search. Defaults to "default" if empty.
    string              space        = 1;
    /// Query embedding vector.
    repeated float      query_vector = 2;
    /// Number of ANN candidates to retrieve (before graph pattern filtering).
    uint32              k            = 3;
    /// Variable name to bind each ANN result node to (e.g. "doc").
    string              seed_variable = 4;
    /// Optional graph patterns to join against the seeds. When empty the
    /// response contains one ScoredBinding per ANN result (just the seed).
    repeated VarPattern patterns     = 5;
    /// Read snapshot timestamp (microseconds since epoch). 0 = latest.
    int64               snapshot_ts  = 6;
    /// Optional pre-filter applied to ANN candidates before pattern evaluation.
    oneof filter {
        NodeTypeFilter     node_type_filter     = 7;
        ReachabilityFilter reachability_filter  = 8;
    }
    /// HNSW exploration factor. 0 = use server default.
    uint32              ef           = 9;
    /// Optional identity for access-control filtering.
    string              user_id      = 10;
    /// Named query parameters for `$param` substitution. Keys are parameter names
    /// (without the `$`); values are JSON-encoded `Value` objects.
    map<string, string> params       = 11;
}

message VectorSeedQueryResponse {
    repeated ScoredBinding bindings = 1;
}

// ── Backup ────────────────────────────────────────────────────────────────────

/// Metadata for a single RocksDB backup.
message BackupInfo {
    uint32 backup_id  = 1;
    /// Unix timestamp (seconds since epoch) when the backup was created.
    int64  timestamp  = 2;
    uint64 size_bytes = 3;
    uint32 num_files  = 4;
}

message CreateBackupRequest {}

message CreateBackupResponse {
    uint32 backup_id  = 1;
    uint64 size_bytes = 2;
    /// Unix timestamp (seconds since epoch) of the new backup.
    int64  created_at = 3;
}

message ListBackupsRequest {}

message ListBackupsResponse {
    repeated BackupInfo backups = 1;
}

message PurgeOldBackupsRequest {
    /// Number of most-recent backups to keep. Older ones are deleted.
    uint32 keep_n = 1;
}

message PurgeOldBackupsResponse {
    uint32 deleted_count = 1;
}

// ── Retention ─────────────────────────────────────────────────────────────────

message RunRetentionRequest {
    /// Delete versions superseded (corrected or deleted) more than this many
    /// seconds ago. The current version of a triple is never deleted.
    uint64 tx_age_secs = 1;
    /// Also delete a triple entirely once all of its versions have a vt_end more
    /// than this many seconds in the past. Set to 0 to disable valid-time
    /// lookback (keep all valid-time history).
    uint64 vt_lookback_secs = 2;
}

message RunRetentionResponse {
    uint64 triples_scanned = 1;
    uint64 triples_deleted = 2;
    uint64 duration_ms     = 3;
}

// ── WAL streaming replication ─────────────────────────────────────────────────

message StreamWalRequest {
    /// WAL sequence number to start streaming from. 0 means start from the
    /// beginning of available WAL (subject to WAL retention settings).
    uint64 since_seq = 1;
}

/// A single WAL entry: one committed write batch and its sequence number.
message WalEntry {
    uint64 sequence_number = 1;
    /// Raw serialised RocksDB WriteBatch bytes.
    bytes  write_batch     = 2;
}

// ── Replica status ────────────────────────────────────────────────────────────

message ReplicaStatusRequest {}

message ReplicaStatusResponse {
    /// True if this server is running as a read replica.
    bool   is_replica              = 1;
    /// gRPC address of the primary (e.g. "http://host:50051"). Empty on primary.
    string primary_address         = 2;
    /// Unix microseconds of the most recent successful WAL apply. 0 if never.
    int64  last_catchup_at         = 3;
    /// Total number of WAL batches applied since server start.
    uint64 catchup_count           = 4;
    /// Last WAL sequence number applied by this replica. 0 if none yet.
    uint64 last_applied_seq        = 5;
    /// Approximate number of WAL entries this replica is behind the primary.
    uint64 replication_lag_entries = 6;
}

// ── Schema migrations ─────────────────────────────────────────────────────────

message MigrateRequest {
    /// When true, report which migrations would run without applying them.
    bool dry_run = 1;
}

message MigrateResponse {
    repeated uint32 applied_versions = 1;
    repeated uint32 skipped_versions = 2;
    string          summary          = 3;
}

message MigrationStatusRequest {}

message MigrationStatusResponse {
    uint32                      current_version = 1;
    uint32                      latest_version  = 2;
    repeated AppliedMigrationInfo applied       = 3;
}

message AppliedMigrationInfo {
    uint32 version             = 1;
    string description         = 2;
    int64  applied_at_tx_time  = 3;
}

// ── Diagnostics ───────────────────────────────────────────────────────────────

message ShowIndexesRequest {}

message ColumnFamilyInfo {
    string name              = 1;
    uint64 approx_key_count  = 2;
    uint64 approx_size_bytes = 3;
}

message VectorSpaceInfo {
    string name         = 1;
    uint32 dimensions   = 2;
    uint64 node_count   = 3;
    string storage_mode = 4;
}

message ShowIndexesResponse {
    repeated ColumnFamilyInfo column_families = 1;
    repeated VectorSpaceInfo  vector_spaces   = 2;
    uint32                    predicate_count  = 3;
}

message ShowStatsRequest {}

message ShowStatsResponse {
    uint64 live_sst_files        = 1;
    uint64 total_sst_size_bytes  = 2;
    uint64 memtable_size_bytes   = 3;
    uint64 mvcc_oracle_ts        = 4;
    uint32 predicate_intern_count = 5;
    uint32 open_transaction_count = 6;
    string mode                  = 7;
    /// Query plan cache statistics.
    uint64 query_cache_hits      = 8;
    uint64 query_cache_misses    = 9;
    uint32 query_cache_size      = 10;
    /// Pre-vocabulary data still awaiting `ConvertLegacyData`
    /// (docs/upgrade-cypher-rdf.md).
    bool   legacy_conversion_pending = 11;
    uint32 legacy_bare_predicates    = 12;
    uint64 legacy_type_labels        = 13;
}

// ── CypherQuery ───────────────────────────────────────────────────────────────

/// Execute a query written in the supported Cypher subset.
///
/// The Cypher string is parsed and compiled to the internal Datalog IR, then
/// evaluated by the same engine as the `Query` RPC. Returns bindings for the
/// variables named in the RETURN clause (filtered to those variable names).
/// When the RETURN clause contains aggregate functions (count(*), collect(), etc.),
/// aggregate values appear in the `values` map of each CypherBinding row.
message CypherQueryRequest {
    /// Cypher query string, e.g.:
    ///   MATCH (a:Person)-[:knows]->(b:Person)
    ///   WHERE a.name = "Alice"
    ///   RETURN a, count(*) AS n
    ///   ORDER BY n DESC
    ///   SKIP 0 LIMIT 10
    string cypher = 1;
    /// Valid-time point-in-time filter (unix microseconds). 0 = now (current
    /// state; deleted/closed triples are hidden). Past timestamp = time-travel.
    int64  as_of_valid_time = 2;
    /// Transaction-time snapshot override (unix microseconds). 0 = latest.
    int64  as_of_tx_time    = 3;
    /// Query embedding vector for VECTOR_NEAR. Required when the Cypher string
    /// contains VECTOR_NEAR(var, "space", k) in the WHERE clause; ignored otherwise.
    repeated float vector   = 4;
    /// HNSW exploration factor for VECTOR_NEAR. 0 = use server default.
    uint32         ef       = 5;
    /// Optional open-transaction ID. Reads from the transaction's snapshot.
    string tx_id = 6;
    /// Optional identity for access-control filtering.
    string user_id = 7;
    /// Named query parameters for `$param` substitution. Keys are parameter names
    /// (without the `$`); values are JSON-encoded `Value` objects.
    map<string, string> params = 8;
    /// Dataset: graph IRIs the MATCH patterns read (unknown IRIs match
    /// nothing). Empty = every graph. A `USE GRAPH` clause takes precedence.
    repeated string graphs = 9;
    /// Leave out inferred facts (the `urn:pg:inferred:*` graphs written by
    /// OWL RL inference); by default they are included.
    bool exclude_inferred = 10;
}

/// One result row from a CypherQuery.
///
/// For plain RETURN (no aggregations) `nodes` carries all bound variables and
/// `values` is empty.  When RETURN contains aggregate functions, `nodes` carries
/// the group-key variables and `values` carries the computed aggregates
/// (e.g. count(*) AS n → `values["n"] = {int_val: 5}`).
message CypherBinding {
    /// Graph-node variable bindings (RETURN a, b).
    map<string, NodeId> nodes  = 1;
    /// Scalar and aggregate variable bindings (count(*) AS n, collect(b) AS bs).
    map<string, Value>  values = 2;
}

/// Response from CypherQuery.
message CypherQueryResponse {
    repeated CypherBinding rows = 1;
}

// ── CypherWrite ───────────────────────────────────────────────────────────────

/// Execute a Cypher write statement (CREATE, MERGE, SET, DELETE).
message CypherWriteRequest {
    /// Cypher write string, e.g.:
    ///   CREATE (a:Person {name: "Alice"})
    ///   MERGE (c:Company {name: "Acme"})
    ///   SET a.active = true
    ///   DELETE a
    string cypher = 1;
    /// Optional open-transaction ID. When set, writes are buffered into the
    /// named transaction rather than auto-committed.
    string tx_id = 2;
    /// Graph IRI to write to and to MATCH in (interned on first use), as
    /// `USE GRAPH <iri>`. Empty = the default graph for writes and every
    /// graph for MATCH / MERGE / DELETE.
    string graph = 3;
    /// Caller identity (optional; also `x-polargraph-user-id`). When set, the
    /// graph ACL applies — see docs/design/graph-acl.md.
    string user_id = 4;
}

message CypherWriteResponse {
    /// UUIDs (16-byte NodeId) of nodes created by this statement (in order).
    repeated bytes created_node_ids = 1;
    /// Total number of property/relation triples inserted.
    uint64 triples_written = 2;
    /// Total number of triples logically deleted (vt_end closed).
    uint64 triples_deleted = 3;
}

// ── ExplainQuery ──────────────────────────────────────────────────────────────

/// Static execution plan for a query, as returned by ExplainQuery.
message ExplainResponse {
    /// Human-readable plan summary (multi-line text).
    string plan_text = 1;
    /// One node per top-level plan step.
    repeated PlanNode nodes = 2;
}

/// A single node in the query execution plan tree.
message PlanNode {
    /// Node kind: "PatternScan", "RecursiveJoin", or "VectorSearch".
    string node_type = 1;
    /// Human-readable description of this step.
    string description = 2;
    /// Column family used for the scan (e.g. "SPO", "POS", "OSP", "full scan").
    string index_used = 3;
    /// Child nodes (e.g. body patterns of a RecursiveJoin).
    repeated PlanNode children = 4;
}

// ── Wire transactions ─────────────────────────────────────────────────────────

message BeginTransactionRequest {}

message BeginTransactionResponse {
    /// Opaque transaction identifier. Pass this in subsequent Insert, Query,
    /// CypherWrite, and CypherQuery RPCs to join the open transaction.
    string tx_id = 1;
}

message CommitTransactionRequest {
    string tx_id = 1;
}

message CommitTransactionResponse {
    /// Total number of triples written (relation + property) in this transaction.
    uint64 triples_written = 1;
}

message RollbackTransactionRequest {
    string tx_id = 1;
}

message RollbackTransactionResponse {}

// ── API key management ────────────────────────────────────────────────────────

message AddApiKeyRequest {
    string key = 1;
}

message AddApiKeyResponse {
    /// Total number of keys now configured (including the newly added one).
    uint32 total_keys = 1;
}

message RevokeApiKeyRequest {
    string key = 1;
}

message RevokeApiKeyResponse {
    /// True when the key was present and has been removed.
    bool found = 1;
    /// Total number of keys remaining after the revocation.
    uint32 total_keys = 2;
}

message ListApiKeysRequest {}

message ListApiKeysResponse {
    /// First 4 characters of each key followed by "****". Full values are
    /// never returned.
    repeated string key_prefixes = 1;
    uint32 total_keys = 2;
}

// ── Graph-native access control ───────────────────────────────────────────────

/// Grant a group access to a specific node or all nodes of a given type.
message GrantAccessRequest {
    /// 16-byte UUID of the Group node.
    bytes group_id = 1;
    oneof target {
        /// Grant access to a specific node (16-byte NodeId UUID).
        bytes  node_id   = 2;
        /// Grant access to all nodes of this registered type (e.g. "Service").
        string type_name = 3;
    }
}

message GrantAccessResponse {}

/// Revoke a group's access grant (closes valid time on the HAS_ACCESS triple).
message RevokeAccessRequest {
    bytes group_id = 1;
    oneof target {
        bytes  node_id   = 2;
        string type_name = 3;
    }
}

message RevokeAccessResponse {}

/// Add a user to a group (writes a MEMBER_OF triple).
message AddUserToGroupRequest {
    /// 16-byte UUID of the User node.
    bytes user_id  = 1;
    /// 16-byte UUID of the Group node.
    bytes group_id = 2;
}

message AddUserToGroupResponse {}

/// Return all nodes and type grants accessible to a user.
message GetUserAccessRequest {
    /// 16-byte UUID of the User node.
    bytes user_id = 1;
}

message GetUserAccessResponse {
    /// Node IDs of all explicitly accessible nodes (expanded from all groups).
    repeated bytes  node_ids    = 1;
    /// Type names whose all-nodes the user has access to.
    repeated string type_grants = 2;
}

// ── Property history ──────────────────────────────────────────────────────────

message GetPropertyHistoryRequest {
    /// 16-byte NodeId of the subject node.
    bytes  subject_id = 1;
    /// Predicate name (interned on first use).
    string predicate  = 2;
    /// Maximum number of versions to return. 0 = default (50).
    uint32 limit      = 3;
}

/// One historical version of a node property.
message PropertyVersion {
    /// JSON-encoded Value (matches the Value wire format used elsewhere).
    string value_json        = 1;
    /// Transaction time of this write, microseconds since Unix epoch.
    int64  transaction_time  = 2;
}

message GetPropertyHistoryResponse {
    /// Versions ordered newest-first by transaction time.
    repeated PropertyVersion versions = 1;
}

// ── DeleteTriples ─────────────────────────────────────────────────────────────

/// Soft-delete request: closes the valid-time window of live triples by writing
/// a superseding triple with vt_end set to the requested timestamp.
message DeleteTriplesRequest {
    /// 16-byte UUID subject IDs to soft-delete triples for.
    repeated bytes subject_ids = 1;
    /// Optional predicate filter — if empty, all predicates for each subject are closed.
    string predicate = 2;
    /// Explicit vt_end in microseconds since Unix epoch; 0 means use server clock.
    int64 vt_end = 3;
    /// Optional 16-byte object NodeId: only relations to this object are closed
    /// (properties are left alone). Empty means any object.
    bytes object_id = 4;
    /// Optional property value: only properties with exactly this value are
    /// closed (relations are left alone). Unset means any value.
    Value value = 5;
    /// Graphs to close the triples in: unset = every graph; `default_graph`,
    /// `iri` or `set` restrict it (a graph variable is invalid). An unknown
    /// IRI is NOT_FOUND.
    GraphTerm graph = 6;
    /// Caller identity (optional; also `x-polargraph-user-id`). When set, the
    /// graph ACL applies — see docs/design/graph-acl.md.
    string user_id = 7;
}

message DeleteTriplesResponse {
    /// Number of triple versions that were closed.
    uint64 deleted_count = 1;
}

// ── RunMaterialization ────────────────────────────────────────────────────────────

/// Request to run OWL 2 RL forward-chaining materialization.
message RunMaterializationRequest {
    /// Ignored (kept for compatibility): a run always recomputes the closure
    /// and diffs it against the inferred graphs.
    bool clear_first = 1;
}

/// Statistics from a materialization run.
message RunMaterializationResponse {
    /// Inferred facts asserted by this run (same as `asserted`).
    uint64 rules_fired = 1;
    /// Live inferred facts after the run.
    uint64 derived_triples = 2;
    /// 1 when the run changed anything, else 0 (kept for compatibility).
    uint32 iterations = 3;
    /// Inferred facts asserted.
    uint64 asserted = 4;
    /// Inferred facts closed (no longer derivable).
    uint64 closed = 5;
}

// ── Service ───────────────────────────────────────────────────────────────────

// ── Named graphs ──────────────────────────────────────────────────────────────

/// One metadata property of a graph (stored in the system graph
/// `urn:pg:graph:meta` as a property of the graph's IRI node).
message GraphMetadata {
    string predicate = 1;
    Value  value     = 2;
}

message GraphInfo {
    string iri = 1;
    /// Interned id (0 = default graph, which has no IRI).
    uint32 id  = 2;
    repeated GraphMetadata metadata = 3;
}

message CreateGraphRequest {
    string iri = 1;
    /// Set (replace) these metadata properties.
    repeated GraphMetadata metadata = 2;
    /// Caller identity (optional; also `x-polargraph-user-id`). When set, the
    /// graph ACL applies — see docs/design/graph-acl.md.
    string user_id = 3;
}

message CreateGraphResponse {
    GraphInfo graph = 1;
}

message ListGraphsRequest {
    /// Only graphs whose metadata has every one of these (predicate, value)
    /// pairs. Empty = all named graphs.
    repeated GraphMetadata filter = 1;
    /// Include the system graph `urn:pg:graph:meta`.
    bool include_system = 2;
}

message ListGraphsResponse {
    repeated GraphInfo graphs = 1;
}

message GraphStatsRequest {
    /// Graph IRI; empty = the default graph.
    string iri = 1;
}

message GraphStatsResponse {
    string iri = 1;
    /// Quads valid now.
    uint64 live_quads = 2;
    /// Latest transaction time among live quads (µs since epoch); 0 if none.
    int64 last_write_tt = 3;
}

message CopyGraphRequest {
    /// Source / target graph IRIs; empty = the default graph.
    string source = 1;
    string target = 2;
    /// true: drop the target's quads first (SPARQL COPY); false: add (ADD).
    bool clear_target = 3;
    /// Caller identity (optional; also `x-polargraph-user-id`). When set, the
    /// graph ACL applies — see docs/design/graph-acl.md.
    string user_id = 4;
}

message CopyGraphResponse {
    uint64 quads = 1;
}

message MoveGraphRequest {
    string source = 1;
    string target = 2;
    /// Caller identity (optional; also `x-polargraph-user-id`). When set, the
    /// graph ACL applies — see docs/design/graph-acl.md.
    string user_id = 3;
}

message DropGraphRequest {
    /// Graph IRI; empty = the default graph.
    string iri = 1;
    /// Caller identity (optional; also `x-polargraph-user-id`). When set, the
    /// graph ACL applies — see docs/design/graph-acl.md.
    string user_id = 2;
}

message DropGraphResponse {
    /// Quads closed (bitemporal: history remains queryable).
    uint64 quads_closed = 1;
}

// ── Atomic changesets ─────────────────────────────────────────────────────────
//
// See docs/design/proposals-shacl.md (8a). Adds and retractions across graphs
// in one transaction, with an optional optimistic precondition.

/// Triples to add to one graph.
message GraphTriples {
    /// Graph IRI ("" = default graph).
    string graph = 1;
    repeated Triple triples = 2;
}

/// One exact quad, e.g. to retract.
message QuadRef {
    NodeId subject = 1;
    string predicate = 2;
    oneof object {
        NodeId node = 3;
        Value value = 4;
    }
    /// Graph IRI ("" = default graph).
    string graph = 5;
    /// Retract the quad in every graph where it is live (that the caller
    /// may write) instead of only `graph`.
    bool all_graphs = 6;
}

message ApplyChangesRequest {
    repeated GraphTriples adds = 1;
    /// Live quads to close (valid time ends now).
    repeated QuadRef retractions = 2;
    /// The commit time the changes were based on (0 = none). If any quad the
    /// changeset adds or retracts — or any value of a single-valued property
    /// it replaces — was committed after it, nothing is applied (ABORTED).
    int64 read_ts = 3;
    /// Fail (FAILED_PRECONDITION, nothing applied) if a retraction matches no
    /// live quad; otherwise such retractions are only counted.
    bool strict = 4;
    /// IRIs to record in the IRI dictionary.
    repeated string iris = 5;
    /// Caller identity (optional; also `x-polargraph-user-id`): author of the
    /// change, and the graph ACL applies (write on every graph touched).
    string user_id = 6;
    /// RDF-star edge annotations to add (default graph), in the same
    /// transaction.
    repeated EdgeAnnotation edge_annotations = 7;
}

message ApplyChangesResponse {
    int64 commit_ts = 1;
    uint64 added = 2;
    uint64 retracted = 3;
    uint64 retractions_not_found = 4;
    /// Edge ids of added relations, in request order.
    repeated bytes edge_ids = 5;
}

// ── SHACL validation ──────────────────────────────────────────────────────────
//
// See docs/design/proposals-shacl.md (8b). Validates a dataset against the
// shapes in shapes graphs, optionally with uncommitted changes overlaid.

message ValidateShapesRequest {
    /// Graphs holding the shapes (at least one).
    repeated string shapes_graphs = 1;
    /// Dataset to validate ("" = default graph); empty = every readable graph.
    repeated string data_graphs = 2;
    /// Uncommitted changes to validate as if applied.
    repeated GraphTriples overlay_adds = 3;
    repeated QuadRef overlay_retractions = 4;
    /// Read point (0 = latest).
    int64 read_ts = 5;
    /// Caller identity (optional; also `x-polargraph-user-id`); shapes and
    /// data graphs must be readable.
    string user_id = 6;
    /// With an overlay, only nodes it touches are validated unless this is set.
    bool all_focus_nodes = 7;
    /// Leave out inferred facts (the `urn:pg:inferred:*` graphs written by
    /// OWL RL inference); by default they are included.
    bool exclude_inferred = 8;
}

message ValidationResult {
    /// Focus node IRI, or unset with `focus_literal` for a literal focus.
    string focus_node = 1;
    Value focus_literal = 2;
    /// Result path in SPARQL property-path syntax (`<p>`, `^<p>`, `<a>/<b>`).
    string path = 3;
    /// Offending value: IRI in `value_node` or a literal in `value_literal`.
    string value_node = 4;
    Value value_literal = 5;
    string source_shape = 6;
    /// Full constraint component IRI.
    string constraint_component = 7;
    /// `sh:Violation`, `sh:Warning` or `sh:Info` (full IRI).
    string severity = 8;
    string message = 9;
}

message ValidateShapesResponse {
    /// `sh:conforms` — no results of any severity.
    bool conforms = 1;
    /// No results of severity sh:Violation.
    bool no_violations = 2;
    repeated ValidationResult results = 3;
}

// ── Change feed ───────────────────────────────────────────────────────────────
//
// See docs/design/change-feed.md. Events come from the change log written by
// every commit; resume with the last `commit_ts` seen.

message SubscribeRequest {
    /// Graph IRIs to follow (empty = every graph the caller can read; "" is
    /// the default graph).
    repeated string graphs = 1;
    /// Only quads with these predicates (empty = all). Graph events always pass.
    repeated string predicates = 2;
    /// Only quads whose subject currently has one of these `__type`s.
    repeated string types = 3;
    /// Deliver commits after this transaction time; 0 = from now. Older than
    /// the retained log → OUT_OF_RANGE (re-sync, then subscribe from now).
    int64 resume_after_ts = 4;
    /// Include property values (otherwise property quads carry no value).
    bool include_values = 5;
    /// Caller identity (optional; also `x-polargraph-user-id`). Events in
    /// graphs the caller can't read are never sent.
    string user_id = 6;
}

enum ChangeKind {
    CHANGE_KIND_UNSPECIFIED   = 0;
    /// A quad version asserted (open-ended valid time).
    CHANGE_KIND_ASSERT        = 1;
    /// A quad version closed (delete, replaced value, graph drop).
    CHANGE_KIND_CLOSE         = 2;
    CHANGE_KIND_GRAPH_CREATED = 3;
    CHANGE_KIND_GRAPH_DROPPED = 4;
    /// Quads of `source_graph` copied into `graph` (ADD / COPY / MOVE).
    CHANGE_KIND_GRAPH_COPIED  = 5;
}

message ChangeEvent {
    /// Commit transaction time — the resume token.
    int64 commit_ts = 1;
    /// Graph IRI ("" = default graph).
    string graph = 2;
    ChangeKind kind = 3;
    /// The quad version (assert / close events).
    Triple quad = 4;
    /// The relation's edge id (relation quads).
    bytes edge_id = 5;
    /// User id that made the change ("" = service call).
    string author = 6;
    /// Source graph of a GRAPH_COPIED event.
    string source_graph = 7;
}

// ── Graph access control ──────────────────────────────────────────────────────
//
// Principals (users and groups) and callers are named by node UUID or IRI.
// When a caller user id is given (field or x-polargraph-user-id), granting
// and revoking need `admin` on the graph; without one the call is a trusted
// service call.

message GrantGraphAccessRequest {
    /// User or group receiving the grant.
    string principal = 1;
    /// Named graph IRI.
    string graph = 2;
    /// `read`, `propose`, `write` or `admin`; replaces an earlier level.
    string level = 3;
    /// Caller identity (optional).
    string user_id = 4;
}

message GrantGraphAccessResponse {}

message RevokeGraphAccessRequest {
    string principal = 1;
    string graph = 2;
    string user_id = 3;
}

message RevokeGraphAccessResponse {
    /// Whether a live grant was revoked.
    bool revoked = 1;
}

message GetGraphAccessRequest {
    /// User whose effective access (own + group grants) to list.
    string principal = 1;
    /// Caller identity (optional); a caller other than `principal` only sees
    /// graphs it administers.
    string user_id = 2;
}

message GraphAccessEntry {
    string graph = 1;
    string level = 2;
}

message GetGraphAccessResponse {
    /// Named graphs the principal can access (the default graph is open to
    /// everyone and not listed).
    repeated GraphAccessEntry graphs = 1;
}

message ExportGraphRequest {
    /// Graph IRI; empty = the default graph.
    string iri = 1;
    /// Export the default graph and every named graph (not the system
    /// graph); `iri` is ignored.
    bool all_graphs = 2;
}

/// One live quad. Relation quads set `node`, property quads set `value`.
message ExportedQuad {
    NodeId subject = 1;
    string predicate = 2;
    oneof object {
        NodeId node = 3;
        Value value = 4;
    }
    /// Graph IRI; empty = the default graph.
    string graph = 5;
}

message ExportGraphChunk {
    repeated ExportedQuad quads = 1;
}

message ResolveIrisRequest {
    /// Nodes to name. At most 10 000 per request.
    repeated NodeId nodes = 1;
}

message ResolveIrisResponse {
    /// One IRI per requested node, in request order: the stored IRI, or
    /// `urn:uuid:<id>` when the node has no dictionary entry.
    repeated string iris = 1;
}

// ── Vocabulary ────────────────────────────────────────────────────────────────
//
// See docs/design/cypher-rdf.md. Bare names (no `:`) resolve under the
// vocabulary base; declared prefixes expand `prefix:local` names in Cypher and
// type filters. Changes apply at once (no restart). Mutations are service
// calls (no user id) on the primary.

message VocabularyPrefix {
    string name = 1;
    string namespace = 2;
}

message LegacyStatus {
    /// Pre-vocabulary data remains; run ConvertLegacyData.
    bool conversion_pending = 1;
    /// Predicates still stored under a bare name.
    repeated string bare_predicates = 2;
    /// Live `__type` label properties.
    uint64 type_labels = 3;
    /// Bare predicates whose IRI already existed, with quads left to merge.
    repeated string pending_merges = 4;
}

message Vocabulary {
    string base = 1;
    repeated VocabularyPrefix prefixes = 2;
    LegacyStatus legacy = 3;
}

message GetVocabularyRequest {}

message SetVocabularyBaseRequest {
    /// Absolute IRI, e.g. `https://example.com/ns/`. Affects names resolved
    /// from now on; stored IRIs are never rewritten.
    string base = 1;
    string user_id = 2;
}

message PutPrefixRequest {
    string name = 1;
    string namespace = 2;
    string user_id = 3;
}

message RemovePrefixRequest {
    string name = 1;
    string user_id = 2;
}

message ConvertLegacyDataRequest {
    /// Report what would change; change nothing.
    bool dry_run = 1;
    string user_id = 2;
}

message PredicateConversion {
    /// The bare name.
    string from = 1;
    /// Its IRI under the vocabulary base.
    string to = 2;
    /// The IRI already existed: live quads were moved (count) and the bare
    /// entry kept as `__legacy__/<name>`; otherwise a metadata-only rename.
    bool merged = 3;
    uint64 quads_moved = 4;
}

message ConvertLegacyDataResponse {
    bool dry_run = 1;
    repeated PredicateConversion predicates = 2;
    /// `__type` labels converted to `rdf:type`.
    uint64 labels_converted = 3;
    /// Status after the run.
    LegacyStatus legacy = 4;
}

// ── Counters (step 9d) ────────────────────────────────────────────────────────
//
// i64 counters per (namespace, node) in their own column family, updated
// atomically without MVCC versions or change-log entries. Service calls only
// (no user id); increments on the primary.

message CounterIncrement {
    NodeId node = 1;
    int64 delta = 2;
}

message IncrementCountersRequest {
    string namespace = 1;
    /// At most 10 000.
    repeated CounterIncrement increments = 2;
    string user_id = 3;
}

message IncrementCountersResponse {}

message GetCountersRequest {
    string namespace = 1;
    /// At most 10 000.
    repeated NodeId nodes = 2;
    string user_id = 3;
}

message GetCountersResponse {
    /// One value per requested node, in request order (0 if never counted).
    repeated int64 values = 1;
}

service PolarGraphService {
    /// Add to counters (service calls, primary only).
    rpc IncrementCounters(IncrementCountersRequest) returns (IncrementCountersResponse);
    /// Read counters (service calls).
    rpc GetCounters(GetCountersRequest) returns (GetCountersResponse);
    /// The vocabulary base, prefixes and legacy-conversion status.
    rpc GetVocabulary(GetVocabularyRequest) returns (Vocabulary);
    /// Set the base IRI for bare names.
    rpc SetVocabularyBase(SetVocabularyBaseRequest) returns (Vocabulary);
    /// Declare or re-point a prefix.
    rpc PutPrefix(PutPrefixRequest) returns (Vocabulary);
    /// Remove a prefix (no-op if absent).
    rpc RemovePrefix(RemovePrefixRequest) returns (Vocabulary);
    /// One-time conversion of pre-vocabulary data: bare predicates → IRIs,
    /// `__type` labels → `rdf:type`. Idempotent and resumable.
    rpc ConvertLegacyData(ConvertLegacyDataRequest) returns (ConvertLegacyDataResponse);

    /// Insert one or more triples in a single atomic transaction.
    /// Returns ABORTED if a write-write conflict is detected.
    rpc Insert(InsertRequest) returns (InsertResponse);

    /// Map node IDs back to IRIs via the IRI dictionary.
    rpc ResolveIris(ResolveIrisRequest) returns (ResolveIrisResponse);

    /// Register a named graph (idempotent) and set its metadata.
    rpc CreateGraph(CreateGraphRequest) returns (CreateGraphResponse);
    /// List named graphs with their metadata, optionally filtered.
    rpc ListGraphs(ListGraphsRequest) returns (ListGraphsResponse);
    /// Live-quad count and last write time of one graph.
    rpc GraphStats(GraphStatsRequest) returns (GraphStatsResponse);
    /// Copy a graph's live quads into another graph (COPY / ADD semantics).
    rpc CopyGraph(CopyGraphRequest) returns (CopyGraphResponse);
    /// Copy into the target (replacing it), then drop the source.
    rpc MoveGraph(MoveGraphRequest) returns (CopyGraphResponse);
    /// Close every live quad of a graph (bitemporal tombstones).
    rpc DropGraph(DropGraphRequest) returns (DropGraphResponse);
    /// Stream the live quads of one graph, or of the whole dataset.
    rpc ExportGraph(ExportGraphRequest) returns (stream ExportGraphChunk);
    /// Apply adds and retractions across graphs atomically.
    rpc ApplyChanges(ApplyChangesRequest) returns (ApplyChangesResponse);
    /// Validate a dataset (optionally with uncommitted changes) against SHACL shapes.
    rpc ValidateShapes(ValidateShapesRequest) returns (ValidateShapesResponse);
    /// Stream committed changes (with resume), filtered by graph access.
    rpc Subscribe(SubscribeRequest) returns (stream ChangeEvent);
    /// Grant a user or group a level on a named graph.
    rpc GrantGraphAccess(GrantGraphAccessRequest) returns (GrantGraphAccessResponse);
    /// Revoke a user's or group's grant on a named graph.
    rpc RevokeGraphAccess(RevokeGraphAccessRequest) returns (RevokeGraphAccessResponse);
    /// A user's effective graph access.
    rpc GetGraphAccess(GetGraphAccessRequest) returns (GetGraphAccessResponse);

    /// Execute a conjunctive query and return all satisfying variable bindings.
    rpc Query(QueryRequest) returns (QueryResponse);

    /// Insert or update a node's embedding vector in the HNSW index.
    rpc InsertVector(InsertVectorRequest) returns (InsertVectorResponse);

    /// Search for the k nearest neighbors of a query vector.
    rpc SearchVector(SearchVectorRequest) returns (SearchVectorResponse);

    /// Return all nodes transitively reachable from `start` via `predicate`.
    /// max_hops = 0 means unlimited depth.
    rpc Reachable(ReachableRequest) returns (ReachableResponse);

    /// Register (or overwrite) a node type schema.
    rpc RegisterNodeType(RegisterNodeTypeRequest) returns (RegisterNodeTypeResponse);

    /// Look up a registered node type by name. Returns an empty definition if
    /// the type does not exist.
    rpc GetNodeType(GetNodeTypeRequest) returns (GetNodeTypeResponse);

    /// Return all registered node type schemas.
    rpc ListNodeTypes(ListNodeTypesRequest) returns (ListNodeTypesResponse);

    /// Validate a property map against a registered schema.
    /// Returns valid=false and a list of error messages on failure.
    rpc ValidateNode(ValidateNodeRequest) returns (ValidateNodeResponse);

    /// Register (or overwrite) an edge type schema.
    rpc RegisterEdgeType(RegisterEdgeTypeRequest) returns (RegisterEdgeTypeResponse);

    /// Look up a registered edge type by predicate name.
    rpc GetEdgeType(GetEdgeTypeRequest) returns (GetEdgeTypeResponse);

    /// Return all registered edge type schemas.
    rpc ListEdgeTypes(ListEdgeTypesRequest) returns (ListEdgeTypesResponse);

    /// Validate an edge's endpoint types and property map against a schema.
    rpc ValidateEdge(ValidateEdgeRequest) returns (ValidateEdgeResponse);

    /// Return all registered predicate names whose domain and range match
    /// the supplied node type names. Unconstrained slots match any type.
    rpc ListPredicatesBetween(ListPredicatesBetweenRequest) returns (ListPredicatesBetweenResponse);

    /// Check the full ontology for consistency:
    /// - cardinality violations across all committed triples
    /// - missing inverse-predicate counterparts
    /// - cycles in the node type hierarchy (should not occur if RegisterNodeType
    ///   enforcement is in place, but this double-checks the live data)
    rpc ValidateOntology(ValidateOntologyRequest) returns (ValidateOntologyResponse);

    /// Vector search with a node-type or reachability filter.
    /// Runs HNSW with a large candidate pool then post-filters to the allowed set.
    rpc SearchVectorFiltered(SearchVectorFilteredRequest) returns (SearchVectorFilteredResponse);

    /// Score an explicit set of node IDs against a query vector; return top-k.
    rpc SearchVectorInSet(SearchVectorInSetRequest) returns (SearchVectorInSetResponse);

    /// Insert multiple vectors into a named space atomically.
    rpc BatchInsertVectors(BatchInsertVectorsRequest) returns (BatchInsertVectorsResponse);

    /// Run an ANN vector search and use the results as seed bindings for a
    /// conjunctive Datalog query. Returns scored binding rows that satisfy
    /// both the vector similarity criterion and all graph patterns.
    rpc VectorSeedQuery(VectorSeedQueryRequest) returns (VectorSeedQueryResponse);

    /// Create a new incremental backup of the live store.
    /// Returns FAILED_PRECONDITION if the server was not started with --backup-dir.
    rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);

    /// List all available backups with ID, timestamp, size, and file count.
    /// Returns FAILED_PRECONDITION if the server was not started with --backup-dir.
    rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);

    /// Delete all but the keep_n most recent backups.
    /// Returns FAILED_PRECONDITION if the server was not started with --backup-dir.
    /// Note: restore is an offline operation — see docs/architecture.md.
    rpc PurgeOldBackups(PurgeOldBackupsRequest) returns (PurgeOldBackupsResponse);

    /// Scan all hexastore column families and delete superseded versions (and
    /// triples whose valid-time windows have fully expired) per the policy.
    /// Triggers a full RocksDB compaction on any CF that had deletions.
    rpc RunRetention(RunRetentionRequest) returns (RunRetentionResponse);

    /// Return replication status for this server instance.
    /// `is_replica` is false and all other fields are zero/empty on the primary.
    rpc ReplicaStatus(ReplicaStatusRequest) returns (ReplicaStatusResponse);

    /// Stream WAL entries from the primary. Returns FAILED_PRECONDITION on a replica.
    /// The stream runs indefinitely until the client disconnects; new entries are
    /// delivered within ~50 ms of commit.
    rpc StreamWal(StreamWalRequest) returns (stream WalEntry);

    /// Return the static execution plan for a query without running it.
    /// No database access is performed — pure static analysis of index selection.
    rpc ExplainQuery(QueryRequest) returns (ExplainResponse);

    /// Apply any pending schema migrations and return the list of versions run.
    /// When dry_run is true, reports what would be applied without making changes.
    /// Returns FAILED_PRECONDITION on a read replica.
    rpc MigrateSchema(MigrateRequest) returns (MigrateResponse);

    /// Return the current and latest migration version, plus the full history
    /// of applied migrations with timestamps.
    rpc MigrationStatus(MigrationStatusRequest) returns (MigrationStatusResponse);

    /// Parse and execute a Cypher query string. Supports a subset of openCypher:
    /// MATCH, WHERE (= only), RETURN, LIMIT; directed relationships; transitive
    /// closure with [:pred*] or [:pred*min..max].
    /// Returns INVALID_ARGUMENT if the Cypher string cannot be parsed or contains
    /// write clauses (CREATE/MERGE/SET/DELETE) — use CypherWrite for mutations.
    rpc CypherQuery(CypherQueryRequest) returns (CypherQueryResponse);

    /// DEPRECATED — removed in the next release; write with ApplyChanges or
    /// SPARQL Update (docs/upgrade-cypher-rdf.md). Responses carry a
    /// `warning` header.
    /// Parse and execute a Cypher write statement (CREATE, MERGE, SET, DELETE).
    /// Executes atomically in a single MVCC transaction.
    /// Returns INVALID_ARGUMENT if the statement cannot be parsed or contains no
    /// write clause. Returns FAILED_PRECONDITION on a read replica.
    rpc CypherWrite(CypherWriteRequest) returns (CypherWriteResponse);

    /// Like `Query` but streams results in chunks of up to 500 bindings each.
    /// Use for large result sets that would otherwise exceed memory or message-size
    /// limits. The final chunk has `done = true`.
    rpc QueryStream(QueryRequest) returns (stream QueryStreamChunk);

    /// Like `CypherQuery` but streams results in chunks. Respects the LIMIT clause
    /// in the Cypher string. The final chunk has `done = true`.
    rpc CypherQueryStream(CypherQueryRequest) returns (stream QueryStreamChunk);

    /// Return per-column-family key counts and sizes, plus HNSW space info.
    rpc ShowIndexes(ShowIndexesRequest) returns (ShowIndexesResponse);

    /// Return server-wide storage and MVCC statistics.
    rpc ShowStats(ShowStatsRequest) returns (ShowStatsResponse);

    /// Open a new multi-RPC transaction. Returns an opaque tx_id.
    /// Pass tx_id to Insert, Query, CypherWrite, or CypherQuery to join the
    /// transaction. Returns FAILED_PRECONDITION on a read replica.
    rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);

    /// Commit an open transaction. Returns ABORTED on write-write conflict,
    /// NOT_FOUND if tx_id is unknown or has expired.
    /// Returns FAILED_PRECONDITION on a read replica.
    rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);

    /// Roll back an open transaction, discarding all buffered writes.
    /// Returns NOT_FOUND if tx_id is unknown or has expired.
    /// Returns FAILED_PRECONDITION on a read replica.
    rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);

    /// Return all RDF-star annotations on the edge identified by `edge_id`.
    /// Returns an empty list if the edge has no annotations or does not exist.
    rpc GetEdgeAnnotations(GetEdgeAnnotationsRequest) returns (GetEdgeAnnotationsResponse);

    /// Resolve the edge UUID(s) for a specific (subject, predicate, object) relation triple.
    /// Used by the SPARQL-star executor to look up edge IDs before fetching annotations.
    rpc GetEdgeIdsByTriple(GetEdgeIdsByTripleRequest) returns (GetEdgeIdsByTripleResponse);

    /// Add a new API key to the live key store. Takes effect immediately.
    /// Returns FAILED_PRECONDITION when the server was started without any
    /// keys (auth is disabled). Returns INVALID_ARGUMENT for an empty key.
    /// Returns FAILED_PRECONDITION on a read replica.
    rpc AddApiKey(AddApiKeyRequest) returns (AddApiKeyResponse);

    /// Remove an API key from the live key store. The caller should immediately
    /// stop using the revoked key. Returns FAILED_PRECONDITION when auth is
    /// disabled. Returns FAILED_PRECONDITION on a read replica.
    rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);

    /// List all configured API keys as masked prefixes (first 4 chars + "****").
    /// Never reveals full key values. Returns FAILED_PRECONDITION on a read
    /// replica.
    rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);

    /// Grant a group access to a specific node or all nodes of a given type.
    /// Writes a HAS_ACCESS (or HAS_ACCESS_TYPE) triple and updates the
    /// in-memory access cache immediately.
    /// Returns FAILED_PRECONDITION on a read replica.
    rpc GrantAccess(GrantAccessRequest) returns (GrantAccessResponse);

    /// Revoke a group's access grant by closing the valid time of the
    /// HAS_ACCESS / HAS_ACCESS_TYPE triple and updating the cache.
    /// Returns FAILED_PRECONDITION on a read replica.
    rpc RevokeAccess(RevokeAccessRequest) returns (RevokeAccessResponse);

    /// Add a user to a group by writing a MEMBER_OF triple and updating
    /// the in-memory access cache.
    /// Returns FAILED_PRECONDITION on a read replica.
    rpc AddUserToGroup(AddUserToGroupRequest) returns (AddUserToGroupResponse);

    /// Return all node IDs and type grants accessible to a user, derived from
    /// their group memberships and HAS_ACCESS / HAS_ACCESS_TYPE triples.
    rpc GetUserAccess(GetUserAccessRequest) returns (GetUserAccessResponse);

    /// Return all historical versions of a node property, ordered newest-first
    /// by transaction time. Scans the full SPO column family without MVCC
    /// deduplication so every committed write is visible.
    rpc GetPropertyHistory(GetPropertyHistoryRequest) returns (GetPropertyHistoryResponse);

    /// Soft-delete triples for one or more subjects by closing their valid-time
    /// window. Each live triple (vt_end == END_OF_TIME) matching the subject (and
    /// optional predicate filter) receives a superseding entry with vt_end set to
    /// the requested timestamp (or server clock when vt_end == 0).
    /// Returns FAILED_PRECONDITION on a read replica.
    rpc DeleteTriples(DeleteTriplesRequest) returns (DeleteTriplesResponse);

    /// Run OWL 2 RL forward-chaining materialization to fixpoint.
    ///
    /// Derives new Relation triples according to the RDFS entailment and OWL
    /// property characteristic rules and writes them to the DRV column family.
    /// The DRV CF is separate from the base hexastore so derived triples can be
    /// wiped and rebuilt cleanly without touching user data.
    ///
    /// Returns FAILED_PRECONDITION on a read replica.
    rpc RunMaterialization(RunMaterializationRequest) returns (RunMaterializationResponse);
}
