[package]
name        = "polargraph-server"
description = "gRPC server binary"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
rust-version.workspace = true

[lib]
name = "polargraph_server"
path = "src/lib.rs"

[[bin]]
name = "polargraphd"
path = "src/main.rs"

[dependencies]
polargraph-core    = { path = "../polargraph-core" }
polargraph-storage = { path = "../polargraph-storage" }
polargraph-query   = { path = "../polargraph-query" }

tokio        = { workspace = true }
tonic        = { workspace = true }
prost        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
uuid         = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
clap                = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util   = { workspace = true }
subtle       = { workspace = true }
toml         = { workspace = true }
tower        = { version = "0.4" }
http         = { version = "0.2" }
dashmap      = { version = "6" }
axum         = { version = "0.6" }
hyper        = { version = "0.14", features = ["server", "http1", "http2"] }
metrics                     = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tonic-health   = { version = "0.11" }
tokio-rustls   = { version = "0.25" }
rustls-pemfile = { version = "2" }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
tempfile    = { workspace = true }
tokio       = { workspace = true }
tokio-stream = { version = "0.1" }
tokio-util  = { workspace = true }
reqwest     = { version = "0.11", features = ["json"] }
serde_json  = { workspace = true }
criterion   = { workspace = true, features = ["async_tokio"] }
hdrhistogram = { workspace = true }

[[bench]]
name    = "throughput"
harness = false
