{{- if .Values.hpa.enabled }}
# NOTE: Meaningful horizontal scaling of PolarGraph requires WAL streaming
# replication (--replica-of) so replicas stay read-consistent. See
# deploy/kubernetes/README.md for the read-replica pattern.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "polargraph.fullname" . }}
  namespace: {{ include "polargraph.namespace" . }}
  labels:
    {{- include "polargraph.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "polargraph.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
